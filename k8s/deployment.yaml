apiVersion: apps/v1
kind: Deployment
metadata:
  name: nag3-student-app
  namespace: nag3-student-app
  labels:
    app: nag3-student-app
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nag3-student-app
  template:
    metadata:
      labels:
        app: nag3-student-app
        version: v1
    spec:
      containers:
      - name: nag3-student-app
        image: gcr.io/your-project-id/nag3-student-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
