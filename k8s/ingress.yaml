apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nag3-student-app-ingress
  namespace: nag3-student-app
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "nag3-student-app-ip"
    networking.gke.io/managed-certificates: "nag3-student-app-ssl-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
  - host: nag3-student-app.yourdomain.com
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: nag3-student-app
            port:
              number: 80
