apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-app-ingress
  namespace: student-app
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "student-app-ip"
    networking.gke.io/managed-certificates: "student-app-ssl-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: student-app-frontend-service
            port:
              number: 3000
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: student-app-backend-service
            port:
              number: 5000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: student-app-ssl-cert
  namespace: student-app
spec:
  domains:
    - yourdomain.com
    - api.yourdomain.com
