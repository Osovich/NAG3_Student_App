apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-prod
  namespace: production
  labels:
    app: backend
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
      environment: production
  template:
    metadata:
      labels:
        app: backend
        environment: production
    spec:
      containers:
      - name: backend
        image: gcr.io/your-gcp-project-id/student-app-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: uri
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-prod-service
  namespace: production
spec:
  selector:
    app: backend
    environment: production
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
