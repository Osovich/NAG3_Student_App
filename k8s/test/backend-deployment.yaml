apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-test
  namespace: test
  labels:
    app: backend
    environment: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      environment: test
  template:
    metadata:
      labels:
        app: backend
        environment: test
    spec:
      containers:
      - name: backend
        image: gcr.io/your-gcp-project-id/student-app-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "test"
        - name: MONGODB_URI
          value: "mongodb://mongo-test:27017/student-app-test"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-test-service
  namespace: test
spec:
  selector:
    app: backend
    environment: test
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
