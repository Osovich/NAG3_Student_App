apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-test
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-test
  template:
    metadata:
      labels:
        app: backend-test
    spec:
      containers:
      - name: backend
        image: gcr.io/your-gcp-project-id/student-app-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "test"
        - name: MONGODB_URI
          value: "mongodb://mongo-test-service:27017/student-app-test"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-test-service
  namespace: test
spec:
  selector:
    app: backend-test
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-test
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-test
  template:
    metadata:
      labels:
        app: mongo-test
    spec:
      containers:
      - name: mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          value: "student-app-test"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-test-service
  namespace: test
spec:
  selector:
    app: mongo-test
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP
