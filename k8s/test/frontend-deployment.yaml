apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-test
  namespace: test
  labels:
    app: frontend
    environment: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      environment: test
  template:
    metadata:
      labels:
        app: frontend
        environment: test
    spec:
      containers:
      - name: frontend
        image: gcr.io/your-gcp-project-id/student-app-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-test-service
  namespace: test
spec:
  selector:
    app: frontend
    environment: test
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
