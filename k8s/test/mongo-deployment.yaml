apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-test
  namespace: test
  labels:
    app: mongo
    environment: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
      environment: test
  template:
    metadata:
      labels:
        app: mongo
        environment: test
    spec:
      containers:
      - name: mongo
        image: mongo:7.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          value: "student-app-test"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc-test
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-test
  namespace: test
spec:
  selector:
    app: mongo
    environment: test
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc-test
  namespace: test
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
