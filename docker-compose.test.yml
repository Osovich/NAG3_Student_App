version: '3.8'
services:
  frontend-test:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=test
      - REACT_APP_API_URL=http://backend-test:5000
    depends_on:
      - backend-test
    networks:
      - test-network

  backend-test:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=test
      - MONGODB_URI=mongodb://mongo-test:27017/student-app-test
    depends_on:
      - mongo-test
    networks:
      - test-network

  mongo-test:
    image: mongo:latest
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=student-app-test
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
