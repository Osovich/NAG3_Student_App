version: '3.8'
services:
  frontend-test:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.test
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=test
      - REACT_APP_API_URL=http://backend-test:5000
    depends_on:
      - backend-test
    networks:
      - test-network

  backend-test:
    build: 
      context: ./backend
      dockerfile: Dockerfile.test
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=test
      - MONGODB_URI=mongodb://mongo-test:27017/student-app-test
      - JWT_SECRET=test-secret-key
    depends_on:
      - mongo-test
    networks:
      - test-network

  mongo-test:
    image: mongo:6.0
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=student-app-test
    volumes:
      - mongo-test-data:/data/db
    networks:
      - test-network

  test-runner:
    build: 
      context: .
      dockerfile: Dockerfile.test-runner
    environment:
      - FRONTEND_URL=http://frontend-test:3000
      - BACKEND_URL=http://backend-test:5000
    depends_on:
      - frontend-test
      - backend-test
    networks:
      - test-network

volumes:
  mongo-test-data:

networks:
  test-network:
    driver: bridge
