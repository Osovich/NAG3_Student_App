name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: gcr.io
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Google Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}

    - name: Build and test frontend
      run: |
        cd frontend
        docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/student-app-frontend:${{ github.sha }} .
        docker run --rm ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/student-app-frontend:${{ github.sha }} npm test

    - name: Build and test backend
      run: |
        cd backend
        docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/student-app-backend:${{ github.sha }} .
        docker run --rm ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/student-app-backend:${{ github.sha }} npm test

    - name: Run integration tests
      run: |
        docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit
        docker-compose -f docker-compose.test.yml down

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials your-cluster-name --zone your-zone --project ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to test environment
      run: |
        kubectl apply -f k8s/namespaces.yaml
        kubectl apply -f k8s/test/

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials your-cluster-name --zone your-zone --project ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to production environment
      run: |
        kubectl apply -f k8s/namespaces.yaml
        kubectl apply -f k8s/production/

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/frontend-prod -n production
        kubectl rollout status deployment/backend-prod -n production
