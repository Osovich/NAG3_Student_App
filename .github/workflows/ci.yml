name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
    
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run Frontend Tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false
    
    - name: Run Backend Tests
      run: |
        cd backend
        npm test
    
    - name: Run Frontend Linting
      run: |
        cd frontend
        npm run lint || echo "Linting not configured"
    
    - name: Run Backend Linting
      run: |
        cd backend
        npm run lint || echo "Linting not configured"
    
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload Frontend Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
    
    - name: Upload Backend Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  docker-build:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Google Container Registry
      uses: docker/login-action@v3
      with:
        registry: gcr.io
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}
    
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-frontend:${{ github.sha }}
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-backend:${{ github.sha }}
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    
    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials staging-cluster --zone=us-central1-a
    
    - name: Deploy to Staging
      run: |
        kubectl set image deployment/student-app-frontend frontend=gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-frontend:${{ github.sha }} -n student-app-staging
        kubectl set image deployment/student-app-backend backend=gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-backend:${{ github.sha }} -n student-app-staging
        kubectl rollout status deployment/student-app-frontend -n student-app-staging
        kubectl rollout status deployment/student-app-backend -n student-app-staging

  deploy-production:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    
    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials production-cluster --zone=us-central1-a
    
    - name: Deploy to Production
      run: |
        kubectl set image deployment/student-app-frontend frontend=gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-frontend:${{ github.sha }} -n student-app
        kubectl set image deployment/student-app-backend backend=gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-app-backend:${{ github.sha }} -n student-app
        kubectl rollout status deployment/student-app-frontend -n student-app
        kubectl rollout status deployment/student-app-backend -n student-app
