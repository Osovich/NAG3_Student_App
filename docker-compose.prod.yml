version: '3.8'
services:
  frontend-prod:
    image: gcr.io/your-gcp-project-id/student-app-frontend:latest
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://api.yourdomain.com
    restart: unless-stopped
    networks:
      - production-network

  backend-prod:
    image: gcr.io/your-gcp-project-id/student-app-backend:latest
    ports:
      - "443:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo-prod:27017/student-app-prod
      - JWT_SECRET=your-production-jwt-secret
    depends_on:
      - mongo-prod
    restart: unless-stopped
    networks:
      - production-network

  mongo-prod:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=student-app-prod
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - production-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend-prod
      - backend-prod
    restart: unless-stopped
    networks:
      - production-network

volumes:
  mongo-data:

networks:
  production-network:
    driver: bridge
