apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: student-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'student-app-backend'
        static_configs:
          - targets: ['student-app-backend-service:5000']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'student-app-frontend'
        static_configs:
          - targets: ['student-app-frontend-service:3000']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'mongodb'
        static_configs:
          - targets: ['mongodb-service:27017']
        metrics_path: '/metrics'
        scrape_interval: 10s

  alert_rules.yml: |
    groups:
    - name: student-app-alerts
      rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% of limit"

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod is crash looping"
          description: "Pod {{ $labels.pod }} is restarting frequently"
